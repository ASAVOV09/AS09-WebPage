<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple calculator for everyday arithmetic.">
    <title>Calculator | Everyday Tools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="calculator">
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><span class="logo-badge">ET</span><span class="logo-text">Everyday Tools</span></a>
            <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open navigation" aria-expanded="false">Menu</button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="calculator.html" class="nav-link active" aria-current="page">Calculator</a></li>
                <li><a href="calendar.html" class="nav-link">Calendar</a></li>
                <li><a href="notes.html" class="nav-link">Notes</a></li>
                <li><a href="clock.html" class="nav-link">Clock</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
            </ul>
        </div>
    </header>
    <main class="main-content">
        <header class="page-header">
            <h1>Calculator</h1>
            <p>Use the buttons or your keyboard. Supports parentheses and standard operation precedence.</p>
        </header>
        <p class="status-message" data-status role="status" aria-live="polite"></p>
        <section class="calculator-wrapper" aria-label="Calculator">
            <div class="calc-display" aria-live="polite">
                <div class="calc-history" id="calcHistory">Ready</div>
                <output class="calc-current" id="calcOutput" aria-label="Calculator display">0</output>
            </div>
            <div class="calc-grid" id="calcKeys">
                <button class="calc-btn action" type="button" data-calc-key="clear">AC</button>
                <button class="calc-btn action" type="button" data-calc-key="delete" aria-label="Delete last character">DEL</button>
                <button class="calc-btn op" type="button" data-calc-key="(">(</button>
                <button class="calc-btn op" type="button" data-calc-key=")">)</button>
                <button class="calc-btn" type="button" data-calc-key="7">7</button>
                <button class="calc-btn" type="button" data-calc-key="8">8</button>
                <button class="calc-btn" type="button" data-calc-key="9">9</button>
                <button class="calc-btn op" type="button" data-calc-key="/">÷</button>
                <button class="calc-btn" type="button" data-calc-key="4">4</button>
                <button class="calc-btn" type="button" data-calc-key="5">5</button>
                <button class="calc-btn" type="button" data-calc-key="6">6</button>
                <button class="calc-btn op" type="button" data-calc-key="*">×</button>
                <button class="calc-btn" type="button" data-calc-key="1">1</button>
                <button class="calc-btn" type="button" data-calc-key="2">2</button>
                <button class="calc-btn" type="button" data-calc-key="3">3</button>
                <button class="calc-btn op" type="button" data-calc-key="-">−</button>
                <button class="calc-btn" type="button" data-calc-key="0">0</button>
                <button class="calc-btn" type="button" data-calc-key=".">.</button>
                <button class="calc-btn op" type="button" data-calc-key="+">+</button>
                <button class="calc-btn equals" type="button" data-calc-key="equals">=</button>
            </div>
        </section>
    </main>
    <footer><div class="footer-content"><p>Everyday Tools — runs right in your browser.</p></div></footer>
    <script src="app.js" defer></script>
</body>
</html>
